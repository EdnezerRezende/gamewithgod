<title>Valentes de Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --earth:#140f0a; --earth-2:#211810; --earth-3:#2e2217;
    --parch:#eadcbd; --parch-dim:#b3a483; --bronze:#c8903f; --bronze-hi:#ecbd6a;
    --olive:#93a35a; --blood:#c0533a; --line:rgba(234,220,189,.16);
    --display:"Marcellus SC","Trajan Pro",Georgia,serif;
    --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--earth);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .8s}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--bronze-hi);outline-offset:3px}

  /* ---------- Overlay screens ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
    padding:clamp(24px,6vh,72px) 16px;background:linear-gradient(180deg,rgba(20,15,10,.35),rgba(20,15,10,.82) 55%,rgba(20,15,10,.95))}
  .card{width:100%;max-width:760px;display:flex;flex-direction:column;gap:20px;margin-block:auto}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze-hi)}
  h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
  h1{font-size:clamp(40px,7vw,76px);line-height:1;color:var(--parch)}
  h2{font-size:clamp(28px,4.4vw,42px);line-height:1.05}
  .lede{font-size:19px;color:var(--parch-dim);margin:0;max-width:58ch}
  .verse{margin:0;padding-left:16px;border-left:2px solid var(--bronze);font-style:italic;font-size:18px;max-width:62ch}
  .verse cite{display:block;margin-top:4px;font-style:normal;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze-hi)}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{border:1px solid var(--line);background:rgba(234,220,189,.06);padding:12px 20px;border-radius:3px;font-weight:500;font-size:16px;transition:background .15s,border-color .15s}
  .btn:hover{background:rgba(234,220,189,.12);border-color:rgba(234,220,189,.35)}
  .btn.primary{background:var(--bronze);border-color:var(--bronze);color:#1b120a;font-weight:700}
  .btn.primary:hover{background:var(--bronze-hi)}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .choice{text-align:left;border:1px solid var(--line);background:rgba(33,24,16,.75);padding:16px;border-radius:3px;display:flex;flex-direction:column;gap:6px}
  .choice strong{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.03em}
  .choice span{color:var(--parch-dim);font-size:15px}
  .choice[aria-pressed="true"]{border-color:var(--bronze-hi);background:rgba(200,144,63,.16)}
  .controls{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;color:var(--parch-dim);margin:0}
  .controls dt{color:var(--parch);font-weight:700}
  .controls dd{margin:0}
  .note{font-size:14px;color:var(--parch-dim);margin:0}
  .stones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px}
  .stone{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:rgba(60,80,82,.35);border-radius:3px;padding:6px;position:relative}
  .stone canvas{width:100%;height:100%;display:block}
  .stone[aria-pressed="true"]{border-color:var(--bronze-hi);background:rgba(200,144,63,.22)}
  .stone b{position:absolute;top:4px;left:6px;font-size:13px;color:var(--bronze-hi)}
  .tally{display:grid;grid-template-columns:1fr auto;gap:8px 24px;max-width:460px;font-variant-numeric:tabular-nums;margin:0}
  .tally dt{color:var(--parch-dim)} .tally dd{margin:0;text-align:right}
  .tally .total{font-family:var(--display);font-size:24px;color:var(--parch);border-top:1px solid var(--line);padding-top:8px}
  .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .checks li{display:flex;gap:10px;align-items:baseline}
  .checks .ok{color:var(--olive);font-weight:700} .checks .no{color:var(--blood);font-weight:700}
  .checks small{color:var(--parch-dim)}
  .stars{font-size:40px;letter-spacing:.1em;color:var(--bronze-hi)} .stars i{font-style:normal;color:rgba(234,220,189,.2)}
  .medal{font-family:var(--display);font-size:26px}
  .medal.ouro{color:#f0c24f} .medal.prata{color:#d6d9dc} .medal.bronze{color:#c9804a}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-variant-numeric:tabular-nums}
  .hud-tl{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;max-width:min(460px,60vw);display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .obj{font-family:var(--display);font-size:20px;letter-spacing:.03em}
  .sub{font-size:15px;color:var(--parch-dim)}
  .hud-tr{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .stat{display:flex;gap:10px;align-items:center}
  .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-dim)}
  .bar{width:140px;height:8px;background:rgba(0,0,0,.45);border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--blood);transition:width .2s}
  .bar.cor i{background:var(--bronze-hi)}
  .pips{display:flex;gap:5px}
  .pips span{width:12px;height:12px;border-radius:50%;background:#9a9a92;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35)}
  .pips span.used{background:transparent;border:1px solid var(--line);box-shadow:none}
  .num{font-size:20px;font-weight:700}
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
  #cross::before,#cross::after{content:"";position:absolute;background:rgba(234,220,189,.85);box-shadow:0 0 2px rgba(0,0,0,.8)}
  #cross::before{left:8px;top:0;width:2px;height:18px} #cross::after{top:8px;left:0;height:2px;width:18px}
  #cross.on::before,#cross.on::after{background:#ffd166}
  #gauge{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:140px;height:140px}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:20px;font-weight:500;text-align:center;max-width:90vw;
    text-shadow:0 2px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}
  #opening{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-family:var(--display);font-size:30px;letter-spacing:.2em;color:var(--bronze-hi);text-shadow:0 0 18px rgba(236,189,106,.6)}
  #hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,30,15,.55));opacity:0;transition:opacity .35s}

  /* ---------- Cutscene ---------- */
  #cine{position:fixed;inset:0;z-index:15;pointer-events:none}
  .bars{position:absolute;left:0;right:0;height:11vh;background:#000}
  .bars.top{top:0} .bars.bot{bottom:0}
  .cine-text{position:absolute;left:16px;right:16px;bottom:calc(11vh + 24px);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  #cine-q{margin:0;max-width:52ch;font-size:clamp(18px,2.4vw,26px);font-style:italic;text-shadow:0 2px 10px rgba(0,0,0,.95);transition:opacity .5s}
  #cine-ref{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze-hi);text-shadow:0 1px 4px #000}
  .cine-hint{position:absolute;right:16px;bottom:calc(11vh - 34px);font-size:13px;color:var(--parch-dim)}
  .pause{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;background:rgba(20,15,10,.85);border:1px solid var(--line);padding:14px 20px;font-size:17px;pointer-events:none}
  .esc-hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--parch-dim);text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:18;transition:opacity .5s}
  /* ---------- Controles de toque (celular e tablet) ---------- */
  #touch{position:fixed;inset:0;z-index:11;pointer-events:none;-webkit-user-select:none;user-select:none}
  #touch > *{pointer-events:auto;touch-action:none}
  #lookpad{position:absolute;top:0;right:0;bottom:0;width:62%}
  #stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
    background:rgba(20,15,10,.35);border:1px solid rgba(234,220,189,.3)}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(234,220,189,.4);border:1px solid rgba(234,220,189,.6)}
  #fire{position:absolute;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:108px;height:108px;border-radius:50%;
    background:rgba(200,144,63,.55);border:2px solid var(--bronze-hi);color:#1b120a;font-weight:700;font-size:17px}
  #fire.on{background:rgba(236,189,106,.95);transform:scale(.96)}
  #tpause{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:52px;height:40px;border-radius:3px;
    background:rgba(20,15,10,.55);border:1px solid rgba(234,220,189,.3);color:var(--parch);font-size:16px;letter-spacing:-2px}
  #rotate{display:none;position:absolute;left:16px;right:16px;top:40%;text-align:center;font-size:18px;background:rgba(20,15,10,.85);border:1px solid var(--line);padding:14px;pointer-events:none}
  @media (orientation:portrait){#rotate{display:block}}
  body.touch .esc-hint{display:none}
  @media (max-width:900px), (max-height:500px){
    .obj{font-size:16px} .sub{font-size:13px} .hud-tl{max-width:48vw}
    .bar{width:90px} .lbl{font-size:10px} #toast{font-size:16px} #opening{font-size:22px}
    #gauge{width:104px;height:104px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  }
  .listen{margin-left:10px;font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(234,220,189,.3);color:var(--bronze-hi);padding:2px 8px;border-radius:3px;cursor:pointer}
  .listen:hover{border-color:var(--bronze-hi)}
  @media (prefers-reduced-motion:reduce){#game,#toast,#fade,#cine-q{transition:none}}
  /* ---------- Mapa das fases ---------- */
  .phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 8px;padding:0;list-style:none}
  .phases li{display:flex}
  .sect{margin:6px 0 -4px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-dim)}
  .phase{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:rgba(33,24,16,.75);color:var(--parch);text-decoration:none;flex:1}
  .phase b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze-hi);font-weight:400}
  .phase strong{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15}
  .phase small{color:var(--parch-dim);font-size:13px}
  .phase .ps{font-size:13px;color:var(--parch-dim)}
  .phase .ps em{font-style:normal;color:var(--bronze-hi);letter-spacing:.08em}
  a.phase:hover{border-color:var(--bronze-hi);background:rgba(200,144,63,.12)}
  .phase.cur{border-color:var(--bronze-hi);background:rgba(200,144,63,.18)}
  .phase.locked{opacity:.5;border-style:dashed}
  .phase.locked strong::before{content:"🔒 ";font-size:15px}
  .lockmsg{padding:14px 16px;border:1px dashed var(--bronze);border-radius:3px;background:rgba(33,24,16,.6)}
</style>

<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-tl"><div id="obj" class="obj"></div><div id="sub" class="sub"></div></div>
  <div class="hud-tr">
    <div class="stat" id="st-stones"><span class="lbl">Pedras</span><span id="pips" class="pips"></span></div>
    <div class="stat" id="st-vida"><span class="lbl">Vida</span><div class="bar"><i id="vida"></i></div></div>
    <div class="stat" id="st-cor"><span class="lbl">Coragem</span><div class="bar cor"><i id="cor"></i></div></div>
    <div class="stat" id="st-score"><span class="lbl">Pontos</span><span id="score" class="num">0</span></div>
  </div>
  <div id="cross"></div>
  <div id="opening" hidden>Abertura</div>
  <canvas id="gauge" width="280" height="280"></canvas>
  <div id="toast"></div>
  <div id="hurt"></div>
  <div class="esc-hint">Esc · pausa e menu · H · ajuda de mira · M · música · N · narração</div>
</div>

<div id="cine" hidden>
  <div class="bars top"></div><div class="bars bot"></div>
  <div class="cine-text"><p id="cine-q"></p><span id="cine-ref"></span></div>
  <div class="cine-hint">Clique: avançar · Enter: pular</div>
</div>
<div id="touch" hidden>
  <div id="lookpad"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="fire" type="button" aria-label="Segure para girar a funda, solte para atirar">Funda</button>
  <button id="tpause" type="button" aria-label="Pausa">❚❚</button>
  <div id="rotate">Gire o celular para jogar na horizontal</div>
</div>
<div id="pause" class="pause" hidden>Clique na tela para jogar · Esc abre a pausa</div>
<div id="fade"></div>
<div id="ov" class="overlay" hidden><div id="ov-card" class="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const PI = Math.PI, G = 9.8;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rand = (a,b) => a + Math.random()*(b-a);
const sstep = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };

// Texto provisório (Almeida, domínio público) — revisar contra a edição escolhida.
const VS = {
  v3:  ['E os filisteus estavam num monte de um lado, e os israelitas estavam num monte do outro lado; e o vale entre eles.', '1 Samuel 17:3'],
  v4:  ['Então saiu do arraial dos filisteus um homem guerreiro, cujo nome era Golias, de Gate, que tinha de altura seis côvados e um palmo.', '1 Samuel 17:4'],
  v10: ['Disse mais o filisteu: Hoje desafio as companhias de Israel, dizendo: Dai-me um homem, para que ambos pelejemos.', '1 Samuel 17:10'],
  v11: ['Ouvindo então Saul e todo o Israel estas palavras do filisteu, espantaram-se, e temeram muito.', '1 Samuel 17:11'],
  v33: ['Porém Saul disse a Davi: Contra este filisteu não poderás ir para pelejar com ele; pois tu ainda és moço.', '1 Samuel 17:33'],
  v34: ['Então disse Davi a Saul: Teu servo apascentava as ovelhas de seu pai; e vinha um leão, ou um urso, e tomava uma ovelha do rebanho; e eu saía após ele, e o feria, e livrava-a da sua boca.', '1 Samuel 17:34-35'],
  v37: ['O Senhor me livrou da mão do leão, e da do urso; ele me livrará da mão deste filisteu.', '1 Samuel 17:37'],
  v39: ['E Saul vestiu a Davi de suas vestes... Então disse Davi a Saul: Não posso andar com isto, pois nunca o usei.', '1 Samuel 17:38-39'],
  v40: ['E tomou o seu cajado na mão, e escolheu para si cinco seixos do ribeiro, e pô-los no alforje de pastor.', '1 Samuel 17:40'],
  v43: ['Disse, pois, o filisteu a Davi: Sou eu algum cão, para tu vires a mim com paus?', '1 Samuel 17:43'],
  v45: ['Davi, porém, disse ao filisteu: Tu vens a mim com espada, e com lança, e com escudo; porém eu venho a ti em nome do Senhor dos Exércitos.', '1 Samuel 17:45'],
  v47: ['...porque do Senhor é a guerra, e ele vos entregará na nossa mão.', '1 Samuel 17:47'],
  v48: ['...Davi se apressou, e correu ao combate, a encontrar-se com o filisteu.', '1 Samuel 17:48'],
  v49: ['E Davi pôs a mão no alforje, e tomou dali uma pedra, e com a funda lha atirou, e feriu o filisteu na testa; e caiu sobre o seu rosto em terra.', '1 Samuel 17:49'],
  v51: ['...vendo os filisteus que o seu campeão era morto, fugiram.', '1 Samuel 17:51'],
  v46: ['...e toda a terra saberá que há Deus em Israel.', '1 Samuel 17:46'],
};
const verseHTML = k => `<blockquote class="verse">${VS[k][0]}<cite>${VS[k][1]} <button class="listen" data-act="speak" data-k="${k}" aria-label="Ouvir o versículo">▶ Ouvir</button></cite></blockquote>`;

const DIFF = {
  pastor:    {name:'Pastor',    desc:'Abertura longa, tiro perfeito fácil de ver e linha da trajetória.', window:5,   arc:140, preview:true,  arcVisible:true,  sway:.35, roar:8,  dardo:15, spear:20, lion:4.2, fore:.30, restart:'duel',    mult:1,   gSpeed:.8},
  guerreiro: {name:'Guerreiro', desc:'O equilíbrio pensado para a maioria dos jogadores.',              window:3.5, arc:100, preview:false, arcVisible:true,  sway:.75, roar:15, dardo:25, spear:35, lion:6,   fore:.22, restart:'duel',    mult:1.5, gSpeed:.95},
  valente:   {name:'Valente',   desc:'Abertura curta, sem indicador visual: só o som do giro certo.',   window:2,   arc:60, preview:false, arcVisible:false, sway:1.3,roar:22, dardo:35, spear:50, lion:7.5, fore:.17, restart:'ribeiro', mult:2,   gSpeed:1.1},
};
let dk = 'guerreiro';
try { const s = localStorage.getItem('vdd-diff'); if (DIFF[s]) dk = s; } catch(e) {}
const D_ = () => DIFF[dk];

// ================= Audio =================
let AC = null, noiseB = null, sfxBus = null, musicBus = null;
const MUSIC_VOL = .5;
let musicOn = true, aimHelp = true;
try { musicOn = localStorage.getItem('vdd-music') !== 'off'; aimHelp = localStorage.getItem('vdd-aim') !== 'off'; } catch(e) {}
function audio(){
  try {
    if (!AC) { AC = new (window.AudioContext||window.webkitAudioContext)();
      noiseB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseB.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      sfxBus = AC.createGain(); sfxBus.connect(AC.destination);
      musicBus = AC.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(AC.destination);
      startDrone(); }
    if (AC.state === 'suspended') AC.resume();
  } catch(e) { AC = null; }
}
function env(g, t, a, dur, peak){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
function noise({dur=.2,freq=800,q=1,type='bandpass',gain=.2,attack=.005,at=0,out=null}={}){
  if(!AC) return; const t=at||AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseB;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=AC.createGain(); env(g,t,attack,dur,gain); s.connect(f).connect(g).connect(out||sfxBus); s.start(t); s.stop(t+dur+.05);
}
function tone({freq=440,dur=.2,type='sine',gain=.15,slide=0,lp=0,attack=.005,at=0,out=null}={}){
  if(!AC) return; const t=at||AC.currentTime, o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=AC.createGain(); env(g,t,attack,dur,gain); let n=o;
  if(lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; n=o.connect(f); } n.connect(g).connect(out||sfxBus);
  o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  whoosh: p => noise({dur:.16,freq:450+900*p,q:1.4,gain:.06+.12*p,attack:.05}),
  throw:  () => noise({dur:.28,freq:1500,q:.8,gain:.22,attack:.01}),
  clay:   () => { noise({dur:.35,freq:2600,q:.6,gain:.35}); tone({freq:330,dur:.12,type:'triangle',gain:.12}); },
  clang:  () => [540,1210,1830,2690].forEach((f,i)=>tone({freq:f,dur:1-i*.18,gain:.1/(i+1)})),
  thud:   () => { tone({freq:95,dur:.22,gain:.3,slide:45}); noise({dur:.1,freq:300,gain:.15}); },
  wood:   () => { tone({freq:170,dur:.14,type:'triangle',gain:.28}); noise({dur:.08,freq:900,gain:.18}); },

// Escala de Ré "hijaz" (sabor do Oriente Médio); a vitória usa Ré maior.
const HIJAZ = [0,1,4,5,7,8,10], MAJOR = [0,2,4,5,7,9,11];
const MOODS = {
  menu:     {bpm:70,  drum:'x.....x.....x...', slap:'....x.......x...', mel:.35, drone:.10},
  cine:     {bpm:62,  drum:'x...............', slap:'................', mel:.22, drone:.13},
  training: {bpm:96,  drum:'x..x..x.x..x..x.', slap:'..x.x.....x.x.x.', mel:.5,  drone:.07},
  duel:     {bpm:120, drum:'x.x...x.x.x..xx.', slap:'.x.xx..x.x.xx.xx', mel:.6,  drone:.13},
  victory:  {bpm:84,  drum:'x...x...x...x.x.', slap:'..x...x...x...xx', mel:.75, drone:.1, major:true},
  quiet:    {bpm:60,  drum:'................', slap:'................', mel:.15, drone:.08},
};
const M = {mood:null, step:0, next:0, idx:4, drone:null};
function startDrone(){
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480;
  const g = AC.createGain(); g.gain.value = 0;
  [73.42, 110, 146.83].forEach((f,i) => { const o = AC.createOscillator(); o.type = i ? 'sawtooth' : 'triangle'; o.frequency.value = f; o.detune.value = i*4; const og = AC.createGain(); og.gain.value = i === 2 ? .35 : 1; o.connect(og).connect(lp); o.start(); });
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .07; lg.gain.value = 180; lfo.connect(lg).connect(lp.frequency); lfo.start();
  lp.connect(g).connect(musicBus); M.drone = g;
  if (M.mood) setMood(M.mood, true);
}
function shofar(){ if (!AC) return; tone({freq:147, dur:1.6, type:'sawtooth', gain:.22, slide:222, lp:900, attack:.15, out:musicBus}); }
function setMood(m, force){
  if (M.mood === m && !force) return;
  const prev = M.mood; M.mood = m;
  if (!AC || !M.drone) return;
  M.drone.gain.setTargetAtTime(MOODS[m].drone, AC.currentTime, .8);
  if ((m === 'duel' || m === 'victory') && prev !== m) shofar();
}
function setMusic(on){
  musicOn = on; try { localStorage.setItem('vdd-music', on ? 'on' : 'off'); } catch(e) {}
  if (AC && musicBus) musicBus.gain.setTargetAtTime(on ? MUSIC_VOL : 0, AC.currentTime, .2);
}
function setAimHelp(on){ aimHelp = on; try { localStorage.setItem('vdd-aim', on ? 'on' : 'off'); } catch(e) {} }
function scaleFreq(md, i){ const sc = md.major ? MAJOR : HIJAZ; return 146.83 * Math.pow(2, (sc[i % 7] + 12*Math.floor(i / 7)) / 12); }
function musicTick(){
  if (!AC || !musicBus || !M.mood || !musicOn || AC.state !== 'running') return;
  const md = MOODS[M.mood], sp = 60/md.bpm/4;
  if (M.next < AC.currentTime) M.next = AC.currentTime + .05;
  while (M.next < AC.currentTime + .25){
    const s = M.step, t = M.next;
    if (md.drum[s] === 'x') tone({freq: s % 8 === 0 ? 105 : 90, dur:.32, gain: s % 8 === 0 ? .55 : .38, slide:42, at:t, out:musicBus});
    if (md.slap[s] === 'x') noise({dur:.07, freq:1900, q:1.3, gain:.16, at:t, out:musicBus});
    if (s % 2 === 0 && Math.random() < md.mel * (s % 4 === 0 ? 1 : .55)){
      M.idx = clamp(M.idx + [-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)], 2, 12);
      const f = scaleFreq(md, M.idx);
      tone({freq:f, dur:.55, type:'triangle', gain:.16, lp:2400, at:t, out:musicBus});
      tone({freq:f*2, dur:.18, type:'sawtooth', gain:.03, lp:3000, at:t, out:musicBus});
    }
    M.step = (s + 1) % 16; M.next += sp;
  }
}
setInterval(musicTick, 40);

function valleyH(x,z){
  const hills = 11*sstep(34, 86, Math.abs(z)) + 2.5*sstep(60,120,Math.abs(x))*sstep(20,60,Math.abs(z));
  const n = .7*Math.sin(x*.05)*Math.sin(z*.07) + .35*Math.sin(x*.13+z*.09);
  const bz = z + 12 + 2*Math.sin(x*.08);
  return hills + n - .9*Math.exp(-(bz*bz)/3);
}
function fieldH(x,z){
  const r = Math.hypot(x, z+8);
  return (2.2*Math.sin(x*.03)*Math.cos(z*.04) + .6*Math.sin(x*.11+z*.07) + 5*sstep(45,140,r)) * sstep(5,32,r);
}
function makeTerrain(hFn, colFn){
  const g = new THREE.PlaneGeometry(380,380,120,120); g.rotateX(-PI/2);
  const p = g.attributes.position, cols=[];
  for (let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), y=hFn(x,z); p.setY(i,y); const c=colFn(x,y,z); cols.push(c.r,c.g,c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3)); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:1}));
}

function buildHuman({h=1.75, robe=0x6b5a3c, skin=0x9a6b48}={}){

  for (const sx of [-1,1]){ const hip = new THREE.Group(); hip.position.set(.12*sx*k,.8*k,0); const l = cyl(.08*k,.07*k,.8*k,skin); l.position.y=-.4*k; hip.add(l); root.add(hip); legs.push(hip); }

// Armies (instanced)
function buildArmy(n, zMin, zMax, robes){
  const grp = new THREE.Group();
  const bodies = new THREE.InstancedMesh(new THREE.CylinderGeometry(.24,.32,1.25,6), new THREE.MeshStandardMaterial({color:0xffffff, flatShading:true, roughness:1}), n);
  const heads = new THREE.InstancedMesh(new THREE.SphereGeometry(.16,6,5), cmat(0x8f6444), n);
  const spears = new THREE.InstancedMesh(new THREE.CylinderGeometry(.025,.025,2.4,4), cmat(0x4e3620), n);
  const m = new THREE.Matrix4(), c = new THREE.Color(); const base = [];
  for (let i=0;i<n;i++){
    const x = rand(-45,45), z = rand(zMin,zMax), y = valleyH(x,z);
    base.push({x,y,z,ph:rand(0,6)});
    m.makeTranslation(x,y+.62,z); bodies.setMatrixAt(i,m); bodies.setColorAt(i, c.set(robes[i%robes.length]).offsetHSL(0,0,rand(-.05,.05)));
    m.makeTranslation(x,y+1.4,z); heads.setMatrixAt(i,m);
    m.makeTranslation(x+.3,y+1.3,z); spears.setMatrixAt(i,m);
  }
  grp.add(bodies, heads, spears); grp.userData = {bodies, heads, spears, base, n};
  return grp;
}

function animArmy(a, t, fear){
  const {bodies, heads, spears, base, n} = a.userData, m = new THREE.Matrix4();
  for (let i=0;i<n;i++){ const b = base[i]; const bob = Math.abs(Math.sin(t*2+b.ph))*.05 + (fear ? Math.sin(t*25+b.ph)*.03 : 0);
    m.makeTranslation(b.x, b.y+.62+bob, b.z); bodies.setMatrixAt(i,m);
    m.makeTranslation(b.x, b.y+1.4+bob, b.z); heads.setMatrixAt(i,m);
    m.makeTranslation(b.x+.3, b.y+1.3+bob, b.z); spears.setMatrixAt(i,m); }
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = spears.instanceMatrix.needsUpdate = true;
}

const SPIN = 1.2;

  S.charging = false; preview.visible = false; marker.visible = false;
  if (!canThrow()) return;
  const d = D_(), dz = zoneDist(), half = sweetArc()/2;

  let smooth = .85;

  err += (1-smooth)*2.4;
  const spd = 16 + 26*power();
  const start = aimStart(camera.getWorldDirection(V()));
  const dir = solveDir(start, aimPoint().p, spd).dir;
  const right = V(1,0,0).applyQuaternion(camera.quaternion), up = V(0,1,0).applyQuaternion(camera.quaternion);

  sfx.throw(); S.whip = .25;

const stoneGeo = new THREE.DodecahedronGeometry(.055,0);
function aimStart(dir){ const right = V(1,0,0).applyQuaternion(camera.quaternion), up = V(0,1,0).applyQuaternion(camera.quaternion); return camera.getWorldPosition(V()).addScaledVector(right,.22).addScaledVector(up,.05).addScaledVector(dir,.4); }

function aimPoint(){
  const o = camera.getWorldPosition(V()), d = camera.getWorldDirection(V()), p = V();
  for (let s = .4; s < 150; s += (s < 60 ? .1 : .4)){

    const gy = groundH(p.x, p.z);

  }

// Ângulo de lançamento (arco baixo) para a pedra, com a velocidade atual, cair exatamente no ponto da mira.
function solveDir(start, target, speed){

function simulateShot(){

  const v = sol.dir.multiplyScalar(spd), arr = prevGeo.attributes.position.array;
  const N = 80, h = .01;
  let n = 0, hit = null, good = false;
  const push = q => { arr[n*3] = q.x; arr[n*3+1] = q.y; arr[n*3+2] = q.z; n++; };

    for (let k=0;k<3;k++){
      v.y -= G*h; p.addScaledVector(v, h);

      if (!hit && p.y < groundH(p.x,p.z)){ p.y = groundH(p.x,p.z); hit = p.clone(); }

    }
    push(p);

function camLook(pos, target){ camera.position.copy(pos); camera.lookAt(target); }
function runCine(lines, onEnd){
  cine = {lines, i:-1, t:0, onEnd}; $('cine').hidden = false; VM.visible = false; nextCineLine();
}
function nextCineLine(){
  if (!cine) return;
  cine.i++; cine.t = 0;
  if (cine.i >= cine.lines.length) return endCine();
  const L = cine.lines[cine.i], q = $('cine-q');
  q.style.opacity = 0;
  const txt = L.v ? VS[L.v][0] : L.text; L.durEff = Math.max(L.dur, narrationSeconds(txt));
  setTimeout(() => { if (!cine) return; q.textContent = txt; $('cine-ref').textContent = L.v ? VS[L.v][1] : (L.ref||''); q.style.opacity = 1; speak(txt); }, 180);
  if (L.start) L.start();
}
function endCine(){
  stopSpeak();
  if (!cine) return; const f = cine.onEnd; cine = null; $('cine').hidden = true; VM.visible = true; timeScale = 1; slowT = 0; if (f) f();
}
function updateCine(dt){
  cine.t += dt; const L = cine.lines[cine.i]; if (!L) return;
  const D = L.durEff || L.dur, p = clamp(cine.t / D, 0, 1);
  if (L.cam) L.cam(p, cine.t);
  if (L.update) L.update(dt, p);
  if (cine.t >= D) nextCineLine();
}
function introPace(dt){
  const g = GL.root; g.position.x = Math.sin(gt*.25)*7; g.position.z = 6; g.position.y = valleyH(g.position.x, 6);
  g.rotation.set(0, PI, 0); GL.legs.forEach((l,i) => l.rotation.x = Math.sin(gt*3+i*PI)*.3);
  ES.root.position.set(g.position.x, valleyH(g.position.x,4.2), 4.2); ES.root.rotation.set(0,PI,0);
}
function startIntroCine(then){
  setMood('cine');
  placeDuel(); GL.root.rotation.x = 0; hideHUD(); mode = 'cine';
  const G_ = () => GL.root.position;
  runCine([
    {v:'v3', dur:6, update:introPace, cam:p => camLook(tmp1.set(lerp(-75,-15,p), lerp(34,24,p), lerp(-40,-62,p)), tmp2.set(0,4,8))},
    {v:'v4', dur:6, update:introPace, cam:p => { const a = lerp(-.9,.7,p), g = G_(); camLook(tmp1.set(g.x+Math.sin(a)*8, g.y+.9, g.z-Math.cos(a)*8), tmp2.set(g.x, g.y+2.3, g.z)); }},
    {v:'v10', dur:5.5, start:() => { sfx.roar(); shake = 1; }, update:(dt,p) => { introPace(dt); GL.head.rotation.x = -.25; GL.arms[0].rotation.z = -.5*Math.min(1,p*4); },
      cam:p => { const g = G_(); camLook(tmp1.set(g.x+.8, g.y+2.3, g.z-3.4+p*.6), tmp2.set(g.x, g.y+2.9, g.z)); }},
    {v:'v11', dur:5.5, update:(dt) => { introPace(dt); GL.arms[0].rotation.z = 0; GL.head.rotation.x = .35; animArmy(israel, gt, true); }, cam:p => camLook(tmp1.set(10-p*4, valleyH(10,-86)+2.6, -90), tmp2.set(0,3,6))},
  ], () => { GL.arms[0].rotation.z = 0; then(); });
}
function startFlashbackCine(then){
  setMood('cine');
  field.visible = true; valley.visible = false; groundH = fieldH; canvas.style.filter = 'sepia(.5) saturate(.85) contrast(1.05)'; mode = 'cine';
  if (T.sheepGrp) field.remove(T.sheepGrp);
  T.sheepGrp = new THREE.Group(); field.add(T.sheepGrp);
  for (let i=0;i<5;i++){ const g = makeSheep(); const a = i/5*PI*2; g.position.set(Math.cos(a)*1.8, 0, -4+Math.sin(a)*1.3); g.position.y = fieldH(g.position.x,g.position.z); g.rotation.y = rand(0,6); T.sheepGrp.add(g); }
  runCine([
    {v:'v33', dur:5.5, cam:p => camLook(tmp1.set(lerp(-12,-6,p), 6, lerp(10,8,p)), tmp2.set(0,.6,-4))},
    {v:'v34', dur:8, cam:p => camLook(tmp1.set(lerp(-4,5,p), lerp(3.5,2.4,p), lerp(6,4,p)), tmp2.set(0,.6,-6))},
  ], then);
}
function startDuelCine(then){
  setMood('cine');
  placeDuel(); hideHUD(); mode = 'cine';
  const g = () => GL.root.position;
  runCine([
    {v:'v43', dur:5, update:() => { GL.head.rotation.x = -.15; }, cam:p => camLook(tmp1.set(g().x+1.6, g().y+2.4, g().z-3.6+p*.4), tmp2.set(g().x, g().y+2.9, g().z))},
    {v:'v45', dur:7, cam:p => camLook(tmp1.set(P.pos.x+.7, P.pos.y+1.85, P.pos.z-1.3+p*1.2), tmp2.set(g().x, g().y+2.2, g().z))},
    {v:'v48', dur:4.5, cam:p => camLook(tmp1.set(24-p*6, 5, -2), tmp2.set(0, 2, 0))},
  ], () => { GL.head.rotation.x = .35; beginDuel(); });
}

function showHUD(){ $('hud').hidden = false; VM.visible = true; }

function showOverlay(html, acts){
  unlock(); const ov = $('ov'); $('ov-card').innerHTML = html; ov.hidden = false; ov.scrollTop = 0;
  ov.onclick = e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; audio();

// ================= Narração dos versículos (voz do navegador) =================
// Procura uma voz masculina em português; o tom mais grave e o ritmo lento deixam a leitura calma.
let narrOn = true;
try { narrOn = localStorage.getItem('vdd-voice') !== 'off'; } catch(e) {}
let ptVoice = null, voiceIsMale = false;
const MALE_VOICE = /antonio|ant[oô]nio|daniel|felipe|ricardo|thiago|f[aá]bio|francisco|heitor|jo[aã]o|paulo|male|masculin|homem/i;
function pickVoice(){
  try {
    const all = speechSynthesis.getVoices(), pt = all.filter(v => /^pt/i.test(v.lang));
    ptVoice = pt.find(v => /pt.?BR/i.test(v.lang) && MALE_VOICE.test(v.name)) || pt.find(v => MALE_VOICE.test(v.name))
           || pt.find(v => /pt.?BR/i.test(v.lang)) || pt[0] || null;
    voiceIsMale = !!(ptVoice && MALE_VOICE.test(ptVoice.name));
  } catch(e) { ptVoice = null; }
}
try { if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch(e) {}
function speak(text){
  if (!narrOn || !text) return;
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/^\.\.\.\s*/, '').replace(/\s*\.\.\.$/, '').replace(/\.\.\./g, ', '));
    u.lang = 'pt-BR'; if (ptVoice) u.voice = ptVoice;
    u.rate = .86; u.pitch = voiceIsMale ? .85 : .6; u.volume = 1;
    if (AC && musicBus && musicOn) musicBus.gain.setTargetAtTime(MUSIC_VOL*.35, AC.currentTime, .3);
    u.onend = u.onerror = () => { if (AC && musicBus && musicOn) musicBus.gain.setTargetAtTime(MUSIC_VOL, AC.currentTime, .6); };
    speechSynthesis.speak(u);
  } catch(e) {}
}
function stopSpeak(){ try { speechSynthesis.cancel(); } catch(e) {} if (AC && musicBus && musicOn) musicBus.gain.setTargetAtTime(MUSIC_VOL, AC.currentTime, .3); }
function setNarration(on){ narrOn = on; try { localStorage.setItem('vdd-voice', on ? 'on' : 'off'); } catch(e) {} if (!on) stopSpeak(); }
/** Tempo para a voz terminar de ler (cerca de 2,4 palavras por segundo), para a cena não cortar a leitura. */
function narrationSeconds(text){ return narrOn ? text.split(/\s+/).length * .42 + 1.2 : 0; }
addEventListener('keydown', e => { if (e.code === 'KeyN' && !e.repeat){ setNarration(!narrOn); toast(narrOn ? 'Narração ligada' : 'Narração desligada', 1.2); } });

// A fase seguinte só abre depois de vencer a anterior. O progresso fica no navegador (vdd-progress).
// Para testes, abrir a página com ?liberar libera todas as fases.
const PHASES = [
  {n:1, href:'index.html', title:'Davi × Golias', ref:'1 Samuel 17'},
  {n:2, href:'fase2.html', title:'Samá e o campo de lentilhas', ref:'2 Samuel 23:11-12'},

  {n:5, href:'fase5.html', title:'Benaia: o leão na cova e o egípcio', ref:'2 Samuel 23:20-23'},
];
const onSite = /netlify\.app$|^localhost$|^127\./.test(location.hostname) || location.protocol === 'file:';
const unlockAll = /[?&]liberar(=|&|$)/.test(location.search);
function loadProgress(){ try { return JSON.parse(localStorage.getItem('vdd-progress')) || {}; } catch(e) { return {}; } }
function phaseOpen(n, prog = loadProgress()){ return !onSite || unlockAll || n === 1 || !!(prog[n-1] && prog[n-1].won); }
// Registra a vitória e diz se ela acabou de liberar a fase seguinte.
function saveWin(n, stars, score){
  const prog = loadProgress(), before = phaseOpen(n + 1, prog), o = prog[n] || {};
  prog[n] = {won:true, stars:Math.max(o.stars || 0, stars), best:Math.max(o.best || 0, score)};
  try { localStorage.setItem('vdd-progress', JSON.stringify(prog)); } catch(e) {}
  const next = PHASES.find(p => p.n === n + 1);
  return next && onSite ? {next, fresh: !before && phaseOpen(n + 1, prog)} : null;
}
function phaseMapHTML(cur){
  if (!onSite) return '';
  const prog = loadProgress();
  return `<div class="sect">Escolha a fase</div><ol class="phases" aria-label="Fases">${PHASES.map(p => {
    const open = phaseOpen(p.n, prog), done = prog[p.n] && prog[p.n].won, st = done ? prog[p.n].stars : 0;
    const status = !open ? `Vença a fase ${p.n - 1} para liberar`
      : done ? `<em>${'★'.repeat(st)}${'☆'.repeat(3 - st)}</em> · recorde ${prog[p.n].best}`
      : p.n === cur ? 'Você está aqui' : 'Liberada';
    const inner = `<b>Fase ${p.n}${p.n === cur ? ' · atual' : ''}</b><strong>${p.title}</strong><small>${p.ref}</small><span class="ps">${status}</span>`;
    if (p.n === cur) return `<li><div class="phase cur${open ? '' : ' locked'}" aria-current="page">${inner}</div></li>`;
    if (!open) return `<li><div class="phase locked" aria-disabled="true">${inner}</div></li>`;
    return `<li><a class="phase" href="${p.href}${unlockAll ? '?liberar' : ''}">${inner}</a></li>`;
  }).join('')}</ol>`;
}
function lockedHTML(n){
  const prev = PHASES.find(p => p.n === n - 1);
  return `<div class="lockmsg"><p class="lede" style="margin:0 0 10px">🔒 Esta fase ainda está trancada. Vença a Fase ${prev.n}, <em>${prev.title}</em>, para liberar.</p>
    <a class="btn primary" style="display:inline-block;text-decoration:none" href="${prev.href}">Ir para a Fase ${prev.n}</a></div>`;
}
function nextPhaseHTML(w){

}

function drawStone(cv, smooth, seed){
  const c = cv.getContext('2d'), W = cv.width; c.clearRect(0,0,W,W);
  const ph = [seed*1.7, seed*2.3, seed*3.1], el = 1 + (1-smooth)*.25*Math.sin(seed*5), N = 48, pts = [];
  for (let i=0;i<N;i++){ const a = i/N*PI*2; const n = Math.sin(a*3+ph[0])*.5 + Math.sin(a*5+ph[1])*.3 + Math.sin(a*9+ph[2])*.2 + (smooth < .5 ? (Math.sin(a*17+seed)*.25) : 0);
    const r = W*.34*(1 + (1-smooth)*.34*n); pts.push([W/2 + Math.cos(a)*r*el, W/2 + Math.sin(a)*r/el]); }
  const grd = c.createRadialGradient(W*.4,W*.38,W*.05,W/2,W/2,W*.45);
  const base = smooth > .7 ? ['#c9c6bb','#7e7a70'] : smooth > .45 ? ['#b8ad98','#6f6555'] : ['#a99a82','#5d5243'];
  grd.addColorStop(0,base[0]); grd.addColorStop(1,base[1]);
  c.beginPath(); pts.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y)); c.closePath(); c.fillStyle = grd; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.stroke();
  if (smooth < .6){ c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1.5; for (let k=0;k<3;k++){ c.beginPath(); c.moveTo(W*(.35+k*.1), W*.35); c.lineTo(W*(.42+k*.08), W*(.55+k*.05)); c.stroke(); } }
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(W*.4,W*.36,W*.08*smooth+2,W*.04*smooth+1,-.5,0,PI*2); c.fill();
}
function goStones(){
  mode = 'result'; hideHUD(); placeDuel();
  const vals = [rand(.86,.98), rand(.84,.96), rand(.8,.93), rand(.5,.68), rand(.48,.66), rand(.52,.7), rand(.2,.38), rand(.22,.4)].sort(() => Math.random()-.5);
  const picked = [];
  showOverlay(`
    <div class="eyebrow">O ribeiro</div>
    <h2>Cinco seixos lisos</h2>
    ${verseHTML('v40')}
    <p class="lede">Escolha 5 pedras. As lisas e arredondadas voam mais retas; as ásperas desviam. A ordem da escolha é a ordem de uso.</p>
    <div class="stones">${vals.map((v,i) => `<button class="stone" data-act="pick" data-i="${i}" aria-pressed="false" aria-label="Pedra ${i+1}"><b></b><canvas width="160" height="160"></canvas></button>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="ok" id="stones-ok" disabled>Guardar no alforje (0/5)</button><button class="btn" data-act="back">Voltar à armadura</button><button class="btn" data-act="menu">Menu</button></div>`, {
    back: goArmor, menu: showMenu,
    pick: b => {
      const i = +b.dataset.i, at = picked.indexOf(i);
      if (at >= 0) picked.splice(at,1); else if (picked.length < 5) picked.push(i);
      document.querySelectorAll('.stone').forEach(el => { const k = picked.indexOf(+el.dataset.i); el.setAttribute('aria-pressed', k >= 0); el.querySelector('b').textContent = k >= 0 ? k+1 : ''; });
      const ok = $('stones-ok'); ok.disabled = picked.length !== 5; ok.textContent = `Guardar no alforje (${picked.length}/5)`;
    },
    ok: () => { flow.stones = picked.map(i => vals[i]); hideOverlay(); tryLock();
      if (flow.kind === 'full' || flow.kind === 'full-after-train' || !flow.seenDuelCine){ flow.seenDuelCine = true; startDuelCine(); } else { placeDuel(); beginDuel(); } },
  });
  document.querySelectorAll('.stone canvas').forEach((cv,i) => drawStone(cv, vals[i], i*1.37 + rand(0,5)));
}

// ================= Main loop =================
let last = performance.now();
function update(dt, rdt){
  gt += dt;
  if (slowT > 0){ slowT -= rdt; if (slowT <= 0) timeScale = 1; }
  shake = Math.max(0, shake - rdt*1.6);
  if (toastT > 0){ toastT -= rdt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (cine) updateCine(dt);
  else if (mode === 'menu'){
    const a = gt*.05; camLook(tmp1.set(Math.sin(a)*48, 14, Math.cos(a)*48 - 6), tmp2.set(0,3,4)); introPace(dt); GL.head.rotation.x = .2;
  }
  else if (playing()){
    updatePlayer(dt); updateSling(dt);
    if (mode === 'training') updateTraining(dt);
    else { D.time += dt; updateGolias(dt); }
    fpCamera();
  }
  if (mode === 'duel' || (cine && D.won)) { if (D.won) updateGolias(dt); }
  updateStones(dt); updateParts(dt); updateDardos(dt);
  if (valley.visible){ animArmy(phil, gt, false); if (!(cine && cine.lines[cine.i] && cine.lines[cine.i].v === 'v11')) animArmy(israel, gt, false); }
  if (shake > 0 && cine){ camera.rotation.x += (Math.random()-.5)*shake*.02; camera.rotation.y += (Math.random()-.5)*shake*.02; }
  VM.visible = playing();
  updateHUD(); drawGauge();
}
function loop(now){
  requestAnimationFrame(loop);
  const rdt = Math.min(.05, (now - last)/1000); last = now;
  const paused = pauseOn || (playing() && !locked && !noLock);
  if (!paused) update(rdt*timeScale, rdt);
  else { updateHUD(); drawGauge(); }
  renderer.render(scene, camera);
}
showMenu();
requestAnimationFrame(loop);
})();
</script>
